<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app use the full screen around the notch and home bar -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Horizon</title>
  <meta name="description" content="A private retirement planner that runs entirely on your phone.">
  <!-- Matches the pre-dawn sky; js/ui/sky.js keeps it in step with the sky as it changes -->
  <meta name="theme-color" content="#070a1c">
  <meta name="color-scheme" content="dark light">
  <!-- Installable web app: opens full screen from the home screen -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Content runs under the status bar, so the sky shows through it -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Horizon">
  <meta name="application-name" content="Horizon">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <!-- Privacy: this page never loads anything from other sites and sends no data anywhere. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- The sky (js/ui/sky.js) is drawn behind everything; the app floats over it -->
  <!-- The whole app is drawn into this element by js/app/app.js -->
  <div id="app" class="app"></div>
  <noscript><p style="padding:24px">This app needs JavaScript turned on.</p></noscript>

  <!-- Math engine (same files the background worker and the tests use) -->
  <script src="js/engine/util.js"></script>
  <script src="data/historical-returns.js"></script>
  <script src="js/engine/defaults.js"></script>
  <script src="js/engine/tax.js"></script>
  <script src="js/engine/socialsecurity.js"></script>
  <script src="js/engine/health.js"></script>
  <script src="js/engine/schedule.js"></script>
  <script src="js/engine/simulate.js"></script>
  <script src="js/engine/montecarlo.js"></script>
  <script src="js/engine/api.js"></script>
  <script src="js/engine/scenarios.js"></script>
  <script src="js/engine/slim.js"></script>
  <script src="js/engine/levers.js"></script>
  <script src="js/engine/explore.js"></script>

  <!-- Charts (local copy of Chart.js, so the app works offline) -->
  <script src="vendor/chart.umd.min.js"></script>

  <!-- Screens and controls -->
  <script src="js/ui/core.js"></script>
  <script src="js/ui/tips.js"></script>
  <script src="js/ui/controls.js"></script>
  <script src="js/ui/sky.js"></script>
  <script src="js/app/store.js"></script>
  <script src="js/app/engine-client.js"></script>
  <script src="js/app/pin.js"></script>
  <script src="js/ui/insights.js"></script>
  <script src="js/ui/levers.js"></script>
  <script src="js/ui/paycheck.js"></script>
  <script src="js/ui/postcard.js"></script>
  <script src="js/ui/plan-fields.js"></script>
  <script src="js/ui/plan.js"></script>
  <script src="js/ui/scenarios.js"></script>
  <script src="js/ui/projection.js"></script>
  <script src="js/ui/home.js"></script>
  <script src="js/ui/charts.js"></script>
  <script src="js/ui/flow.js"></script>
  <script src="js/ui/futures.js"></script>
  <script src="js/ui/compare.js"></script>
  <script src="js/ui/timeline.js"></script>
  <script src="js/ui/checklist.js"></script>
  <script src="js/ui/checkin.js"></script>
  <script src="js/ui/progress.js"></script>
  <script src="js/ui/setup.js"></script>
  <script src="js/ui/explore.js"></script>
  <script src="js/app/app.js"></script>
</body>
</html>
