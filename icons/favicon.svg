<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Horizon favicon: the app icon pared down to read at 16-32px.
       Big sun, one thick growth curve, two reflection glints. No stars, no sheen.
       A hairline rim keeps the tile's edge visible on dark browser tab bars. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.55" stop-color="#241b5c"/>
      <stop offset="0.8" stop-color="#4b2c7a"/>
    </linearGradient>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="31" cy="37" r="17">
      <stop offset="0" stop-color="#fff4dc"/>
      <stop offset="0.55" stop-color="#ffcf7f"/>
      <stop offset="1" stop-color="#ffa340"/>
    </radialGradient>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="31" cy="43" r="26">
      <stop offset="0.6" stop-color="#ffb347" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0f33"/>
      <stop offset="1" stop-color="#0a0c26"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
    <clipPath id="above"><path d="M-4 48 C20 48 38 42 68 22 L68 -4 L-4 -4 Z"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <!-- Sun, half-risen above the growth curve -->
    <circle cx="31" cy="43" r="26" fill="url(#halo)" clip-path="url(#above)"/>
    <circle cx="31" cy="43" r="17" fill="url(#sun)" clip-path="url(#above)"/>
    <!-- Water below the curve -->
    <path d="M-4 48 C20 48 38 42 68 22 L68 68 L-4 68 Z" fill="url(#water)"/>
    <!-- Reflection -->
    <rect x="22" y="51.5" width="18" height="3" rx="1.5" fill="#ffb347" opacity="0.9"/>
    <rect x="27" y="57" width="9" height="2.5" rx="1.25" fill="#ffb347" opacity="0.55"/>
    <!-- The growth curve -->
    <path d="M-4 48 C20 48 38 42 68 22" fill="none" stroke="#ffe2a8" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <!-- Hairline rim -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#fff" stroke-width="1.5" stroke-opacity="0.16"/>
</svg>
