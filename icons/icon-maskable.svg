<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Horizon maskable icon (Android). Same art as icon.svg, scaled to 85% about the centre so the sun,
       growth curve and reflection sit inside the central ~70% safe circle; the sky and water still fill the square.
       Change both files together. -->
  <defs>
    <!-- Pre-dawn sky: deep navy at the top, indigo, then violet toward the horizon.
         (Starts at y=-90 so that, after the 85% scale below, it still begins at the canvas top.) -->
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="-90" x2="0" y2="740">
      <stop offset="0" stop-color="#080b20"/>
      <stop offset="0.25" stop-color="#0e1442"/>
      <stop offset="0.6" stop-color="#211b5a"/>
      <stop offset="0.85" stop-color="#3d2674"/>
      <stop offset="1" stop-color="#58317f"/>
    </linearGradient>
    <!-- Dawn haze where the horizon climbs on the right, so the sky stays lighter than the water there -->
    <radialGradient id="haze">
      <stop offset="0" stop-color="#c8607e" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#8a4aa8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#5a2f7f" stop-opacity="0"/>
    </radialGradient>
    <!-- Warm sunrise bloom behind the sun -->
    <radialGradient id="bloom" gradientUnits="userSpaceOnUse" cx="512" cy="625" r="540">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#e4706a" stop-opacity="0.32"/>
      <stop offset="0.7" stop-color="#7a3f8f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4b2c7a" stop-opacity="0"/>
    </radialGradient>
    <!-- The sun: hot white-gold core easing out to amber -->
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="512" cy="570" r="270">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="0.45" stop-color="#ffdc9a"/>
      <stop offset="0.8" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </radialGradient>
    <!-- Water: clearly darker than the sky all along the horizon; never quite black at the bottom -->
    <linearGradient id="water" gradientUnits="userSpaceOnUse" x1="0" y1="360" x2="0" y2="1024">
      <stop offset="0" stop-color="#0c0d2e"/>
      <stop offset="0.5" stop-color="#080a25"/>
      <stop offset="1" stop-color="#0b0d29"/>
    </linearGradient>
    <!-- A little rose light the dawn throws on the water beneath the sun -->
    <radialGradient id="waterglow">
      <stop offset="0" stop-color="#d0688a" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#8a4aa8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5a2f7f" stop-opacity="0"/>
    </radialGradient>
    <!-- Growth line: opaque throughout (no seam), deeper amber on the low left, near-white as it rises -->
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="0">
      <stop offset="0" stop-color="#ee8f40"/>
      <stop offset="0.45" stop-color="#ffc66e"/>
      <stop offset="1" stop-color="#fff0d2"/>
    </linearGradient>
    <!-- Reflection glints: saturated amber, brightest in the middle, tapering at each end -->
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffa340" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ffc46b"/>
      <stop offset="0.7" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ffa340" stop-opacity="0"/>
    </linearGradient>
    <!-- Deeper glints shift toward orange rather than just fading, so they stay saturated over the navy -->
    <linearGradient id="glint-deep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3a" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ff9a40"/>
      <stop offset="0.5" stop-color="#ffaa4c"/>
      <stop offset="0.7" stop-color="#ff9a40"/>
      <stop offset="1" stop-color="#ff8a3a" stop-opacity="0"/>
    </linearGradient>
    <!-- Fades the whole reflection gently with depth (one mask, not per-bar opacity) -->
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="640" x2="0" y2="800">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.5"/>
    </linearGradient>
    <mask id="depth" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424">
      <rect x="-200" y="-200" width="1424" height="1424" fill="url(#fade)"/>
    </mask>
    <!-- Glass sheen: a faint cool top light, like Apple's own icons -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb0ff" stop-opacity="0.05"/>
      <stop offset="0.3" stop-color="#9fb0ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="shimmer" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <!-- The horizon is a rising growth curve (low on the left, climbing to the right).
         Its ends run far past the canvas so the art can be scaled down for the maskable icon. -->
    <clipPath id="above"><path d="M-2000 715 L-20 715 C380 715 660 585 1044 355 L3000 -817 L3000 -3000 L-2000 -3000 Z"/></clipPath>
    <clipPath id="below"><path d="M-2000 715 L-20 715 C380 715 660 585 1044 355 L3000 -817 L3000 3000 L-2000 3000 Z"/></clipPath>
  </defs>

  <g id="art" transform="translate(512 512) scale(0.85) translate(-512 -512)">
    <!-- Sky -->
    <rect x="-2000" y="-3000" width="5000" height="6000" fill="url(#sky)"/>
    <ellipse cx="940" cy="425" rx="480" ry="240" fill="url(#haze)"/>
    <rect x="-2000" y="-3000" width="5000" height="6000" fill="url(#bloom)"/>
    <!-- Two last stars before dawn (big enough to survive at 180 px) -->
    <circle cx="214" cy="206" r="8" fill="#fff" opacity="0.38"/>
    <circle cx="796" cy="148" r="7" fill="#fff" opacity="0.3"/>

    <!-- Sun, half-risen: only the part above the growth curve shows -->
    <g clip-path="url(#above)">
      <circle cx="512" cy="625" r="262" fill="#ffb347" opacity="0.55" filter="url(#glow)"/>
      <circle cx="512" cy="625" r="254" fill="url(#sun)"/>
    </g>

    <!-- Water -->
    <g clip-path="url(#below)">
      <rect x="-2000" y="-3000" width="5000" height="6000" fill="url(#water)"/>
      <ellipse cx="512" cy="640" rx="360" ry="250" fill="url(#waterglow)"/>
      <!-- Sun's reflection: three broken glints straight down from the sun, uneven, fading with depth -->
      <g mask="url(#depth)" filter="url(#shimmer)">
        <rect x="412" y="664" width="204" height="18" rx="9" fill="url(#glint)"/>
        <rect x="452" y="704" width="140" height="14" rx="7" fill="url(#glint-deep)"/>
        <rect x="474" y="748" width="64" height="11" rx="5.5" fill="url(#glint-deep)"/>
      </g>
    </g>

    <!-- The growth line itself, with a soft glow -->
    <path d="M-2000 715 L-20 715 C380 715 660 585 1044 355 L3000 -817" fill="none" stroke="#ffb347" stroke-width="46" stroke-opacity="0.35" filter="url(#soft)"/>
    <path d="M-2000 715 L-20 715 C380 715 660 585 1044 355 L3000 -817" fill="none" stroke="url(#line)" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- Glass top light (unscaled, always full-bleed) -->
  <rect width="1024" height="1024" fill="url(#sheen)"/>
</svg>
